root = "."
tmp_dir = "tmp"

[build]
# cmd = "go build -o ./tmp/main ."
cmd = "swag init -g main.go -d .,./api && go build -o ./tmp/main ."
bin = "tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["vendor", "tmp", "videos", "docs"]
exclude_regex = ["_test\\.go"]

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true

# [watcher]
# delay = 100
